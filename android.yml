name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Generar APK
        run: npx cordova build android --debug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Tienda-San-Jose-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
